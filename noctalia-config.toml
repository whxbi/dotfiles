[bar]
order = [ "default" ]

    [bar.default]
    capsule_radius = 6
    capsule_thickness = 0.54999999143183231
    color = "primary"
    concave_edge_corners = false
    end = [
        "media",
        "audio_visualizer",
        "tray",
        "notifications",
        "clipboard",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "control-center",
        "session",
        "status"
    ]
    icon_color = "secondary"
    start = [ "launcher", "wallpaper", "workspaces", "group:g1" ]

        [[bar.default.capsule_group]]
        accordion = false
        accordion_direction = "end"
        border_width = 1.0
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "cpu", "ram", "temp" ]
        opacity = 1.0
        padding = 6.0
        radius = 6.0

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = [ "desktop-widget-0000000000000001", "desktop-widget-0000000000000003" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 1842.0
    cy = 108.5
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

    [desktop_widgets.widget.desktop-widget-0000000000000003]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 600.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000003.settings]
        background = false

[dock]
auto_hide = true
border = "primary"
border_width = 0.5
concave_edge_corners = false
enabled = true
icon_size = 32
launcher_position = "start"
reserve_space = false
show_dots = true
show_instance_count = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "HDMI-A-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "aristides/udiskie" ]

[shell]
app_icon_color = "outline"
corner_radius_scale = 2.0
screen_time_enabled = true
settings_window_translucent = true
show_close_buttons = false
telemetry_enabled = true

    [shell.panel]
    border_color = "primary"
    clipboard_placement = "attached"
    launcher_placement = "attached"
    open_near_click_clipboard = true
    open_near_click_wallpaper = true
    transparency_mode = "glass"

[theme]
builtin = "Tokyo-Night"
community_palette = "Catppuccin Macchiato Lavender"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "btop", "kitty", "niri" ]

[wallpaper]
directory = "/home/whxbi/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/whxbi/Pictures/Wallpapers/purple_forest.png"

    [wallpaper.last]
    path = "/home/whxbi/Pictures/Wallpapers/purple_forest.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/whxbi/Pictures/Wallpapers/purple_forest.png"

[weather]
enabled = false

[widget.active_window]
enabled = false

[widget.audio_visualizer]
bands = 128
color_2 = "secondary"
scale = 2.5
width = 100

[widget.status]
type = "aristides/udiskie:status"
