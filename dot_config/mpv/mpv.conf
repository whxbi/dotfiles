# --- Video Output & Rendering Pipeline ---
vo=gpu-next
gpu-api=vulkan,auto
hwdec=auto-safe
fbo-format=rgba16hf

# --- Audio ---
audio-channels=stereo
alang=en,eng,und
slang=en,eng

# --- Performance & Caching ---
cache=yes
cache-secs=20
demuxer-readahead-secs=20

# --- Quality of Life ---
save-position-on-quit
autofit-larger=90%x90%
volume=80
fullscreen=yes

# --- Subtitles ---
sub-font="Noto Sans"
sub-border-size=2.0
# sub-pos=98

# --- UI ---
osc=no
