# --- Playback ---
SPACE cycle pause                     # Pause / Unpause
> playlist-next                      # Next episode
< playlist-prev                      # Previous episode

# --- Seeking ---
RIGHT seek 10                        # Forward 10 seconds
LEFT seek -10                        # Backward 10 seconds

# --- Volume & Brightness ---
UP add volume 5                      # Volume up
DOWN add volume -5                   # Volume down
3 add brightness 1                   # Brightness up
4 add brightness -1                  # Brightness down

# --- Speed Control (Hold to Speedup) ---
= script-binding hold_accelerate/fastPlay    # Hold to speed up (default: 2.0x)
- script-binding hold_accelerate/slowPlay    # Hold to slow down (default: 0.5x)

# --- Subtitles & Audio ---
v cycle sub-visibility               # Toggle subtitles on/off
j cycle sub                          # Next subtitle track
J cycle sub down                     # Previous subtitle track
# cycle audio                        # Next audio track (use '#' as default)

# --- Files & Playlist ---
F8 script-binding modernz/playlist      # Show playlist (requires uosc; ModernZ has its own menu)
# For opening a directory/file, you can use the terminal or drag-and-drop.

# --- Fullscreen & Screen Fit ---
f cycle fullscreen                   # Toggle fullscreen
A cycle aspect                       # Cycle aspect ratio / screen fit

# --- Shuffle ---
# To enable shuffle, add this line to the file:
Ctrl+Shift+s cycle shuffle
