palette = "noctalia"
# ~/.config/starship.toml

# The main layout with curvy corners
format = """[╭━󰣇](bold) $username$hostname [in](bold) $directory $fill[━󰣇](bol) $time
[╰━](bold)$character"""

# The long line filling the screen
[fill]
symbol = "━"
style = "bold"

# Username & Hostname
[username]
style_user = "bold"
format = "[$user]($style)"
show_always = true

[hostname]
style = "bold"
format = "[@$hostname]($style)"
ssh_only = false

# Directory
[directory]
style = "bold"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Time (with Nerd Font clock symbol)
[time]
style = "bold"
format = "[ 󰥔 $time]($style)"
time_format = "%H:%M"
disabled = false

# The bottom arrow for your cursor
[character]
success_symbol = "[➜](bold)"
error_symbol = "[✗](bold red)"

# >>> NOCTALIA STARSHIP PALETTE >>>
